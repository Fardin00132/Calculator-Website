<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماشین حساب من</title>
<style>
body {
  background: #111827;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.calculator {
  background: #1f2937;
  padding: 20px;
  border-radius: 20px;
  width: 300px;
}
#display {
  width: 100%;
  box-sizing: border-box;
  height: 75px;
  margin-bottom: 15px;
  font-size: 30px;
  text-align: right;
  border: none;
  border-radius: 10px;
  padding: 10px;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button {
  height: 60px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #374151;
  color: white;
}
button:hover { background: #4b5563; }
.operator { background: #2563eb; }
.equal { background: #16a34a; }
.clear { background: #dc2626; }
</style>
</head>
<body>
<div class="calculator">
<input id="display" value="0" readonly>
<div class="keys">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="del()">⌫</button>
<button onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>

<script>
const display = document.getElementById('display');

function add(value) {
  if(display.value === '0' || display.value === 'Error')
    display.value = value;
  else display.value += value;
}

function clearDisplay() {
  display.value = '0';
}

function del() {
  display.value = display.value.slice(0,-1) || '0';
}

function calculate() {
  try {
    const expression = display.value;
    if(!/^[0-9+\-*/%.() ]+$/.test(expression))
      throw new Error();
    const result = Function('"use strict";return (' + expression + ')')();
    if(!Number.isFinite(result)) throw new Error();
    display.value = String(Number(result.toFixed(10)));
  } catch {
    display.value = 'Error';
  }
}
</script>
</body>
</html>
